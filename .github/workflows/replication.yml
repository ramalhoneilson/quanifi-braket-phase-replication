name: Replicate historical discrepancy
on: [push, pull_request, workflow_dispatch]
jobs:
  replication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python replicate.py --check --shots 512 --output results/ci
      - run: uv run --locked python isolate.py --check --output results/isolation-ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replication-evidence
          path: results/
